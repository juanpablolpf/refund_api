# Postgres para desenvolvimento e testes: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: refund-api-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: refund
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
